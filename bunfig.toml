[install]
# Only install versions published at least 14 days ago (14 * 24 * 60 * 60)
minimumReleaseAge = 1209600

# Reduce accidental dependency confusion / typo installs at runtime.
auto = "disable"

# Keep lockfile diff-friendly in Git.
saveTextLockfile = true

# Pin newly added dependencies exactly instead of ranges.
exact = true
